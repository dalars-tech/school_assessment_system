<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assessment Results</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 10px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      text-align: center;
    }

    .learner-info {
      margin-top: 25px;
      line-height: 1.8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 9px;
      text-align: left;
    }

    th {
      background: #eee;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Student Assessment Results</h1>

  <input
    type="text"
    id="assessmentNumber"
    placeholder="Enter Assessment Number"
  >

  <button onclick="searchLearner()">Search</button>

  <div id="message"></div>

  <div id="results"></div>

</div>

<script>

  // YOUR SUPABASE DETAILS
  const SUPABASE_URL = "https://dduxprtjexkcuauahuwn.supabase.co";
  const SUPABASE_KEY = "sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy";


  async function searchLearner() {

    const assessmentNumber =
      document.getElementById("assessmentNumber").value.trim();

    const message =
      document.getElementById("message");

    const resultsDiv =
      document.getElementById("results");


    resultsDiv.innerHTML = "";

    if (!assessmentNumber) {
      message.innerHTML = "Please enter an assessment number.";
      return;
    }


    message.innerHTML = "Searching...";


    try {

      // FIND LEARNER
      const learnerUrl =
        SUPABASE_URL +
        "/rest/v1/school_app_learners?assessment_number=eq." +
        encodeURIComponent(assessmentNumber) +
        "&select=id,school_id,assessment_number,learner_name,grade,class";


      const learnerResponse =
        await fetch(learnerUrl, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });


      if (!learnerResponse.ok) {
        throw new Error(await learnerResponse.text());
      }


      const learners =
        await learnerResponse.json();


      if (learners.length === 0) {

        message.innerHTML =
          "Learner not found.";

        return;
      }


      const learner = learners[0];


      // FIND RESULTS
      const resultsUrl =
        SUPABASE_URL +
        "/rest/v1/school_app_results?learner_id=eq." +
        encodeURIComponent(learner.id) +
        "&select=learning_area,points,rubric_code,term,year&order=id";


      const resultsResponse =
        await fetch(resultsUrl, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });


      if (!resultsResponse.ok) {
        throw new Error(await resultsResponse.text());
      }


      const learnerResults =
        await resultsResponse.json();


      message.innerHTML = "";


      // LEARNER INFORMATION
      let html = `

        <div class="learner-info">

          <h2>${learner.learner_name}</h2>

          <strong>School ID:</strong>
          ${learner.school_id}<br>

          <strong>Learner ID:</strong>
          ${learner.id}<br>

          <strong>Assessment Number:</strong>
          ${learner.assessment_number}<br>

          <strong>Grade:</strong>
          ${learner.grade}<br>

          <strong>Class:</strong>
          ${learner.class}

        </div>

      `;


      // RESULTS TABLE
      if (learnerResults.length === 0) {

        html += "<p>No results found.</p>";

      } else {

        html += `

          <h2>Assessment Results</h2>

          <table>

            <tr>
              <th>Learning Area</th>
              <th>Points</th>
              <th>Rubric Code</th>
              <th>Term</th>
              <th>Year</th>
            </tr>

        `;


        learnerResults.forEach(result => {

          html += `

            <tr>

              <td>${result.learning_area}</td>

              <td>${result.points}</td>

              <td>${result.rubric_code || ""}</td>

              <td>${result.term}</td>

              <td>${result.year}</td>

            </tr>

          `;

        });


        html += `
          </table>
        `;

      }


      resultsDiv.innerHTML = html;


    } catch (error) {

      console.error(error);

      message.innerHTML =
        "Unable to connect to database.";

      resultsDiv.innerHTML =
        "<p>" + error.message + "</p>";

    }

  }

</script>
<!-- ADMIN UPLOAD RESULTS -->
<div class="container" style="margin-top:20px;">
    <h2>Admin - Upload Results</h2>

    <label for="resultsFile">Select PDF or Word Results File:</label>
    <input
        type="file"
        id="resultsFile"
        accept=".pdf,.doc,.docx"
        style="display:block; margin:15px 0;"
    >

    <button onclick="uploadResultsFile()">
        Upload Results
    </button>

    <p id="uploadStatus"></p>
</div>

<script>
async function uploadResultsFile() {
    const fileInput = document.getElementById("resultsFile");
    const status = document.getElementById("uploadStatus");

    if (!fileInput.files.length) {
        status.textContent = "Please select a PDF or Word file first.";
        return;
    }

    const file = fileInput.files[0];

    status.textContent = "File selected: " + file.name;
}
</script>
<script>
function calculateAggregate() {
    const table = document.querySelector("#results table");

    if (!table) return;

    const rows = table.querySelectorAll("tbody tr");

    let aggregate = 0;
    let count = 0;

    rows.forEach(row => {
        const cells = row.querySelectorAll("td");

        if (cells.length >= 2) {
            const points = parseInt(cells[1].textContent.trim(), 10);

            if (!isNaN(points)) {
                aggregate += points;
                count++;
            }
        }
    });

    if (count === 0) return;

    let rubric = "";

    if (aggregate <= 9) {
        rubric = "BE2";
    } else if (aggregate <= 18) {
        rubric = "BE1";
    } else if (aggregate <= 27) {
        rubric = "AE2";
    } else if (aggregate <= 36) {
        rubric = "AE1";
    } else if (aggregate <= 45) {
        rubric = "ME2";
    } else if (aggregate <= 54) {
        rubric = "ME1";
    } else if (aggregate <= 63) {
        rubric = "EE2";
    } else {
        rubric = "EE1";
    }

    const aggregatePoints = document.getElementById("aggregatePoints");
    const aggregateRubric = document.getElementById("aggregateRubric");

    if (aggregatePoints) {
        aggregatePoints.textContent = aggregate;
    }

    if (aggregateRubric) {
        aggregateRubric.textContent = rubric;
    }
}

window.addEventListener("load", calculateAggregate);
</script>

</body>
</html>
