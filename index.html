<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Results</title>
</head>

<body>

  <h1>Student Results</h1>

  <input id="schoolId" type="text" placeholder="Enter Assessment Number">

  <button id="searchButton">Search</button>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = "https://dduxprtjexkcuauahuwn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy";

    const input = document.getElementById("schoolId");
    const button = document.getElementById("searchButton");
    const result = document.getElementById("result");

    button.addEventListener("click", async function () {

      const assessmentNumber = input.value.trim();

      if (!assessmentNumber) {
        result.innerHTML = "<p>Please enter your Assessment Number.</p>";
        return;
      }

      result.innerHTML = "<p>Searching...</p>";

      try {

        const url =
          SUPABASE_URL +
          '/rest/v1/%22Learners%22?assessment_number=eq.' +
          encodeURIComponent(assessmentNumber);

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error(text);
        }

        const learners = JSON.parse(text);

        if (learners.length === 0) {
          result.innerHTML = "<p>No learner found.</p>";
          return;
        }

        const learner = learners[0];

        result.innerHTML = `
          <h2>${learner["Learner name"] || ""}</h2>
          <p><strong>Assessment Number:</strong> ${learner.assessment_number || ""}</p>
          <p><strong>Grade:</strong> ${learner.Grade || ""}</p>
          <p><strong>Class:</strong> ${learner.Class || ""}</p>
        `;

      } catch (error) {

        console.error(error);

        result.innerHTML =
          "<p>Database error: " + error.message + "</p>";
      }

    });
  </script>

</body>
</html>
