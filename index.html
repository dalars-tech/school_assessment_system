<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Results</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Student Results</h1>

  <label for="schoolId">School ID</label>

  <input
    type="text"
    id="schoolId"
    placeholder="Enter your School ID"
  >

  <button id="searchButton">Search</button>

  <div id="result"></div>

  <script>
    const SUPABASE_URL =
      "https://dduxprtjexkcuauahuwn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy";

    const button = document.getElementById("searchButton");
    const schoolIdInput = document.getElementById("schoolId");
    const result = document.getElementById("result");

    button.addEventListener("click", async function () {

      const schoolId = schoolIdInput.value.trim();

      if (!schoolId) {
        result.innerHTML = "<p>Please enter your School ID.</p>";
        return;
      }

      result.innerHTML = "<p>Searching...</p>";

      try {

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/Learners?school_id=eq." +
          encodeURIComponent(schoolId),
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("Database request failed");
        }

        const learners = await response.json();

        if (learners.length === 0) {
          result.innerHTML =
            "<p>No learner found for this School ID.</p>";
          return;
        }

        result.innerHTML = "";

        learners.forEach(function (learner) {

          const card = document.createElement("div");

          card.innerHTML = `
            <h2>${learner.full_name || "Learner"}</h2>
            <p><strong>School ID:</strong> ${learner.school_id || ""}</p>
            <p><strong>Grade:</strong> ${learner.grade || ""}</p>
          `;

          result.appendChild(card);

        });

      } catch (error) {

        console.error(error);

        result.innerHTML =
          "<p>Unable to connect to the database.</p>";
      }

    });
  </script>

</body>
</html>
