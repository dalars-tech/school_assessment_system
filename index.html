<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Results</title>
</head>

<body>

  <h1>Student Results</h1>

  <input id="schoolId" type="text" placeholder="Enter Assessment Number">

  <button id="searchButton">Search</button>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = "https://dduxprtjexkcuauahuwn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy";

    const input = document.getElementById("schoolId");
    const button = document.getElementById("searchButton");
    const result = document.getElementById("result");

    button.addEventListener("click", async function () {

      const assessmentNumber = input.value.trim();

      if (!assessmentNumber) {
        result.innerHTML = "<p>Please enter your Assessment Number.</p>";
        return;
      }

      result.innerHTML = "<p>Searching...</p>";

      try {

        const url =
          SUPABASE_URL +
          '/rest/v1/learners?assessment_number=eq.' +
          encodeURIComponent(assessmentNumber);

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        const text = await response.text();

        if (!response.ok) {
          throw new Error(text);
        }

        const learners = JSON.parse(text);

        if (learners.length === 0) {
          result.innerHTML = "<p>No learner found.</p>";
          return;
        }

       const learner = learners[0];

const resultsUrl =
  SUPABASE_URL +
  "/rest/v1/Results?learner_id=eq." +
  encodeURIComponent(learner.id) +
  "&select=learning_area,points,Rubric_Code,term,year";

const resultsResponse = await fetch(resultsUrl, {
  method: "GET",
  headers: {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY
  }
});

if (!resultsResponse.ok) {
  throw new Error(await resultsResponse.text());
}

const learnerResults = await resultsResponse.json();

let resultsHTML = "";

if (learnerResults.length === 0) {
  resultsHTML = "<p>No results found.</p>";
} else {
  resultsHTML = `
    <h3>Results</h3>
    <table border="1" cellpadding="8">
      <tr>
        <th>Learning Area</th>
        <th>Points</th>
        <th>Rubric Code</th>
        <th>Term</th>
        <th>Year</th>
      </tr>
      ${learnerResults.map(r => `
        <tr>
          <td>${r.learning_area || ""}</td>
          <td>${r.points ?? ""}</td>
          <td>${r.Rubric_Code || ""}</td>
          <td>${r.term || ""}</td>
          <td>${r.year || ""}</td>
        </tr>
      `).join("")}
    </table>
  `;
}

result.innerHTML = `
  <h2>${learner.learner_name || learner["Learner name"] || ""}</h2>
  <p><strong>Assessment Number:</strong> ${learner.assessment_number || ""}</p>
  <p><strong>Grade:</strong> ${learner.grade || ""}</p>
  <p><strong>Class:</strong> ${learner.class || ""}</p>
  ${resultsHTML}
`;

      } catch (error) {

        console.error(error);

        result.innerHTML =
          "<p>Database error: " + error.message + "</p>";
      }

    });
  </script>

</body>
</html>
