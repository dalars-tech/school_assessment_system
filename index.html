<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Student Results</h1>

  <label for="schoolId">School ID</label>
  <input
    type="text"
    id="schoolId"
    placeholder="Enter School ID"
  >

  <button onclick="searchResults()">Search</button>

  <div id="message"></div>
  <div id="results"></div>

  <script>
    const SUPABASE_URL = "https://dduxprtjexkcuauahuwn.supabase.co";

    async function searchResult() {
  const schoolId = document.getElementById("schoolId").value.trim();
  const result = document.getElementById("result");

  if (!schoolId) {
    result.innerHTML = "<p>Please enter your School ID.</p>";
    return;
  }

  result.innerHTML = "<p>Searching...</p>";

  try {
    const response = await fetch(
      "https://dduxprtjexkcuauahuwn.supabase.co/rest/v1/learners?school_id=eq." +
      encodeURIComponent(schoolId),
      {
        method: "GET",
        headers: {
          "apikey": "sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy",
          "Authorization": "Bearer sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy"
        }
      }
    );

    if (!response.ok) {
      throw new Error("Database request failed");
    }

    const learners = await response.json();

    if (learners.length === 0) {
      result.innerHTML = "<p>No learner found for this School ID.</p>";
      return;
    }

    result.innerHTML = learners.map(learner => `
      <div>
        <h3>${learner.full_name || "Learner"}</h3>
        <p>School ID: ${learner.school_id || ""}</p>
        <p>Grade: ${learner.grade || ""}</p>
      </div>
    `).join("");

  } catch (error) {
    console.error(error);
    result.innerHTML = "<p>Unable to connect to the database.</p>";
  }
}

      message.textContent = "Searching...";

      try {
        const response = await fetch(
          ${SUPABASE_URL}/rest/v1/learners?school_id=eq.${encodeURIComponent(schoolId)},
          {
            method: "GET",
            headers: {
              "apikey": "sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy",
              "Authorization": "Bearer sb_publishable_HilgEkh5cx8xC4eM_LvjJQ_qIlXM0Wy"
            }
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText);
        }

        const data = await response.json();

        if (data.length === 0) {
          message.textContent = "No learner records found for this School ID.";
          return;
        }

        message.textContent = Found ${data.length} learner record(s).;

        data.forEach((learner) => {
          const box = document.createElement("div");
          box.className = "result";

          box.innerHTML = `
            <strong>Learner:</strong> ${learner.full_name ?? "N/A"}<br>
            <strong>School ID:</strong> ${learner.school_id ?? "N/A"}<br>
            <strong>Grade:</strong> ${learner.grade ?? "N/A"}
          `;

          results.appendChild(box);
        });

      } catch (error) {
        console.error(error);
        message.textContent =
          "Unable to connect to the results database.";
      }
    }
  </script>

</body>
</html>
