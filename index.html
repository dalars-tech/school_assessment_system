<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRMS - Digital Results Management System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 30px;
      color: #163b65;
      margin-bottom: 8px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #222;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #163b65;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .parent-link {
      text-align: center;
      margin-top: 20px;
    }

    .parent-link a {
      color: #163b65;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>DRMS</h1>
      <p>Digital Results Management System</p>
    </div>

    <div class="card">

      <h2>Administrator Login</h2>

      <p class="subtitle">
        Authorized DRMS administrators and school uploaders
      </p>

      <form id="loginForm">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Sign In
        </button>

      </form>

      <div class="parent-link">
        <a href="#" id="parentPortal">
          Parent Results Portal
        </a>
      </div>

    </div>

    <div class="footer">
      © 2026 Digital Results Management System
    </div>

  </div>

</body>
</html>
