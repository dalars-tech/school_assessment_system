<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Results</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    input, button {
      padding: 12px;
      margin: 5px 0;
      font-size: 16px;
    }

    input {
      width: 90%;
    }

    button {
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      font-weight: bold;
    }

    .error {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Student Results</h1>

  <input
    type="text"
    id="assessmentNumber"
    placeholder="Enter assessment number"
  >

  <button onclick="searchResult()">Search</button>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = "https://dduxprtjexkcuauahuwn.supabase.co/rest/v1/";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkdXhwcnRqZXhrY3VhdWFodXduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDU4MDUsImV4cCI6MjEwMTU4MTgwNX0._xA0xWEoEEN5-fo01QmyUuq3rNiHtRpqFY9fQyIqsJA";

    async function searchResult() {
      const result = document.getElementById("result");
      const assessmentNumber =
        document.getElementById("assessmentNumber").value.trim();

      result.innerHTML = "<p>Searching...</p>";

      try {
        if (!assessmentNumber) {
          result.innerHTML = "<p>Please enter an assessment number.</p>";
          return;
        }

        /* Find learner */
        const learnerUrl =
          SUPABASE_URL +
          "/rest/v1/learners?assessment_number=eq." +
          encodeURIComponent(assessmentNumber) +
          "&select=id,school_id,assessment_number,learner_name,grade,class";

        const learnerResponse = await fetch(learnerUrl, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!learnerResponse.ok) {
          throw new Error(await learnerResponse.text());
        }

        const learners = await learnerResponse.json();

        if (!learners.length) {
          result.innerHTML = "<p>Learner not found.</p>";
          return;
        }

        const learner = learners[0];

        /* Find results using John's learner ID */
        const resultsUrl =
          SUPABASE_URL +
          "/rest/v1/Results?learner_id=eq." +
          encodeURIComponent(learner.id) +
          "&select=learner_id,learning_area,points,Rubric_Code,term,year";

        const resultsResponse = await fetch(resultsUrl, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!resultsResponse.ok) {
          throw new Error(await resultsResponse.text());
        }

        const learnerResults = await resultsResponse.json();

        let resultsHTML = "";

        if (learnerResults.length === 0) {
          resultsHTML = "<p>No results found.</p>";
        } else {
          resultsHTML = `
            <h3>Results</h3>

            <table>
              <tr>
                <th>Learning Area</th>
                <th>Points</th>
                <th>Rubric Code</th>
                <th>Term</th>
                <th>Year</th>
              </tr>

              ${learnerResults.map(r => `
                <tr>
                  <td>${r.learning_area || ""}</td>
                  <td>${r.points ?? ""}</td>
                  <td>${r.Rubric_Code || ""}</td>
                  <td>${r.term || ""}</td>
                  <td>${r.year || ""}</td>
                </tr>
              `).join("")}
            </table>
          `;
        }

        result.innerHTML = `
          <h2>${learner.learner_name || ""}</h2>

          <p>
            <strong>Assessment number:</strong>
            ${learner.assessment_number || ""}
          </p>

          <p>
            <strong>Grade:</strong>
            ${learner.grade || ""}
          </p>

          <p>
            <strong>Class:</strong>
            ${learner.class || ""}
          </p>

          ${resultsHTML}
        `;

      } catch (error) {
        console.error(error);

        result.innerHTML = `
          <p class="error">
            Unable to connect to database.
          </p>
          <p class="error">
            ${error.message || ""}
          </p>
        `;
      }
    }
  </script>

</body>
</html>
