<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRMS - Digital Results Management System</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #163b65;
      font-size: 34px;
    }

    .header h2 {
      margin: 7px 0;
      font-size: 19px;
      color: #222;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .description {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d3d8df;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #163b65;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #163b65;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 20px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .parent-link {
      text-align: center;
      margin-top: 22px;
    }

    .parent-link a {
      color: #163b65;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>DRMS</h1>
    <h2>Digital Results Management System</h2>
    <p>Secure School Assessment Results Management</p>
  </div>

  <div class="card">

    <h3>Administrator Login</h3>

    <p class="description">
      Authorized DRMS administrators and school uploaders only.
    </p>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

    </form>

    <div id="message"></div>

    <div class="parent-link">
      <a href="parent.html">
        Parent Results Portal →
      </a>
    </div>

  </div>

  <div class="footer">
    © 2026 Digital Results Management System
  </div>

</div>

<script>

/*
  =====================================================
  DRMS SUPABASE CONNECTION
  =====================================================

  IMPORTANT:
  Replace the two values below with the SAME
  Supabase Project URL and Publishable/Anon Key
  you already obtained from Supabase.

  NEVER use the Supabase service-role/secret key here.
*/

const SUPABASE_URL =
  "https://odronoyfmxlijuuzadpc.supabase.co/rest/v1/";

const SUPABASE_KEY =
  "sb_publishable_HCyXJTwKQL1cbh5-4v54pQ_3vaY9zqd";


/*
  Create Supabase client
*/

const supabaseClient =
  window.supabase.createClient(
    ,https://odronoyfmxlijuuzadpc.supabase.co/rest/v1/
    sb_publishable_HCyXJTwKQL1cbh5-4v54pQ_3vaY9zqd
  );


/*
  Login
*/

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  message.textContent = "Signing in...";
  message.style.color = "#555";

  loginButton.disabled = true;

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      console.error("DRMS LOGIN ERROR:", error);

      message.textContent =
        "Login failed: " + error.message;

      message.style.color = "#b42318";

      loginButton.disabled = false;

      return;
    }


    if (!data || !data.session) {

      message.textContent =
        "Login succeeded, but no session was created.";

      message.style.color = "#b42318";

      loginButton.disabled = false;

      return;
    }


    message.textContent =
      "Login successful. Opening dashboard...";

    message.style.color = "#087443";


    /*
      Give Supabase a moment to save the session,
      then open the dashboard.
    */

    setTimeout(function() {

      window.location.href =
        "dashboard.html";

    }, 500);


  } catch (error) {

    console.error(
      "DRMS UNEXPECTED ERROR:",
      error
    );

    message.textContent =
      "Unable to connect to the login system.";

    message.style.color = "#b42318";

    loginButton.disabled = false;
  }

});

</script>

</body>
</html>
